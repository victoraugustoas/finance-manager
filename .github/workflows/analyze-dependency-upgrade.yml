name: Dependency Upgrade Analysis

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
    types: [opened, synchronize, reopened]

concurrency:
  group: dep-upgrade-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  analyze:
    name: Analyze dependency upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if analysis already ran for this revision
        id: already-analyzed
        uses: actions/github-script@v9
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const shaMarker = `<!-- dependency-upgrade-analysis:${headSha} -->`;
            const prNumber = context.issue.number;

            let page = 1;
            let found = false;
            while (true) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
                page,
              });
              if (comments.length === 0) break;

              for (const comment of comments) {
                if (comment.body.startsWith(shaMarker)) {
                  found = true;
                  break;
                }
              }
              if (found || comments.length < 100) break;
              page++;
            }

            core.setOutput('skip', String(found));
            if (found) {
              core.info(`Analysis already posted for SHA ${headSha}. Skipping.`);
            } else {
              core.info(`No analysis found for SHA ${headSha}. Proceeding.`);
            }

      - name: Skip — already analyzed
        if: steps.already-analyzed.outputs.skip == 'true'
        run: echo "Analysis already ran for this commit. Skipping."

      - name: Install pnpm
        if: steps.already-analyzed.outputs.skip != 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.already-analyzed.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Extract changed packages from PR diff
        if: steps.already-analyzed.outputs.skip != 'true'
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Capture both files for change detection. Renovate commonly
          # bumps only the lockfile (when the range in package.json
          # already accepts the new version), so we must inspect the
          # lockfile diff as well as the manifest diff.
          git show $BASE:package.json     > /tmp/package.base.json 2>/dev/null || echo '{}' > /tmp/package.base.json
          git show $BASE:pnpm-lock.yaml   > /tmp/lockfile.base.yaml 2>/dev/null || echo ''   > /tmp/lockfile.base.yaml
          cp ./package.json     /tmp/package.head.json
          cp ./pnpm-lock.yaml   /tmp/lockfile.head.yaml

          node - <<'EOF'
          const fs = require('fs');

          const basePkg   = JSON.parse(fs.readFileSync('/tmp/package.base.json', 'utf8'));
          const headPkg   = JSON.parse(fs.readFileSync('/tmp/package.head.json', 'utf8'));
          const baseLock  = fs.readFileSync('/tmp/lockfile.base.yaml',  'utf8');
          const headLock  = fs.readFileSync('/tmp/lockfile.head.yaml',  'utf8');

          const changes = [];

          // ---- 1) Direct changes in package.json -----------------------------
          const depSections = ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies'];
          for (const section of depSections) {
            const b = basePkg[section] || {};
            const h = headPkg[section] || {};
            for (const pkg of Object.keys(h)) {
              if (b[pkg] && h[pkg] !== b[pkg]) {
                changes.push({
                  pkg, from: String(b[pkg]).replace(/^[\^~]/, ''),
                  to: String(h[pkg]).replace(/^[\^~]/, ''), section, kind: 'changed',
                });
              } else if (!b[pkg] && h[pkg]) {
                changes.push({
                  pkg, from: null,
                  to: String(h[pkg]).replace(/^[\^~]/, ''), section, kind: 'added',
                });
              }
            }
            for (const pkg of Object.keys(b)) {
              if (!h[pkg] && b[pkg]) {
                changes.push({
                  pkg, from: String(b[pkg]).replace(/^[\^~]/, ''),
                  to: null, section, kind: 'removed',
                });
              }
            }
          }

          // Root-level fields (packageManager, engines, pnpm.overrides, etc.)
          for (const field of ['packageManager', 'engines']) {
            const b = basePkg[field];
            const h = headPkg[field];
            if ((b || null) !== (h || null) && (b || h)) {
              changes.push({
                pkg: field,
                from: b == null ? null : String(b),
                to:   h == null ? null : String(h),
                section: 'root',
                kind: b == null ? 'added' : (h == null ? 'removed' : 'changed'),
              });
            }
          }

          // ---- 2) Lockfile-only changes (resolved-version bumps) -------------
          // Parse `importers:` block: each entry has a `specifier` (range
          // from package.json) and a `version` (resolved by pnpm, possibly
          // with peer-dep suffix like `11.4.5(peer@1.0.0)(peer2@2.0.0)`).
          // We compare the bare version (before the first `(`) between
          // base and head to detect resolved-version bumps that are not
          // accompanied by a specifier change in package.json.
          const stripPeerSuffix = (v) => {
            if (!v) return v;
            const i = v.indexOf('(');
            return i === -1 ? v : v.slice(0, i);
          };

          // Track which direct deps have already been recorded from
          // package.json (so we don't double-count them).
          const recordedDirect = new Set(
            changes
              .filter((c) => depSections.includes(c.section))
              .map((c) => `${c.section}::${c.pkg}`)
          );

          // Match by specifier first, then by name. The specifier
          // appears on the line right after the package name, and the
          // version on the line after that.
          function parseImporters(yamlText) {
            const lines = yamlText.split('\n');
            const out = new Map(); // key = "section::name" -> {specifier, version}
            let inImporters = false;
            let currentSection = null;
            let currentName = null;
            for (const line of lines) {
              if (/^importers:/.test(line)) { inImporters = true; continue; }
              if (inImporters && /^[a-zA-Z]/.test(line) && !line.startsWith('  ')) break;
              if (!inImporters) continue;

              // 2-space indent = importer name (e.g. "  .:"); 4-space = section; 6-space = dep name
              const secMatch   = line.match(/^    ([a-zA-Z][a-zA-Z0-9_-]*):\s*$/);
              const nameMatch  = line.match(/^      '?(@?[a-z0-9][^']*)'?:$/);
              const specMatch  = line.match(/^        specifier:\s*(.+?)\s*$/);
              const verMatch   = line.match(/^        version:\s*(.+?)\s*$/);

              if (secMatch) { currentSection = secMatch[1]; currentName = null; continue; }
              if (nameMatch) { currentName = nameMatch[1].replace(/\\'/g, "'"); continue; }
              if (currentSection && currentName && specMatch) {
                out.set(`${currentSection}::${currentName}`, { specifier: specMatch[1] });
              }
              if (currentSection && currentName && verMatch) {
                const key = `${currentSection}::${currentName}`;
                const prev = out.get(key) || {};
                prev.version = verMatch[1];
                out.set(key, prev);
              }
            }
            return out;
          }

          const baseImp = parseImporters(baseLock);
          const headImp = parseImporters(headLock);

          // Only treat a change as a "lockfile bump" if the bare resolved
          // version differs and the change isn't already recorded from
          // package.json. The specifier is informational only.
          for (const [key, headInfo] of headImp) {
            const baseInfo = baseImp.get(key);
            if (!baseInfo || !baseInfo.version || !headInfo.version) continue;
            if (recordedDirect.has(key)) continue;

            const baseVer = stripPeerSuffix(baseInfo.version);
            const headVer = stripPeerSuffix(headInfo.version);
            if (baseVer === headVer) continue;

            const [section, pkg] = key.split('::');
            changes.push({
              pkg,
              from: baseVer,
              to:   headVer,
              section,
              kind: 'lockfile-bump',
              specifier: headInfo.specifier || null,
            });
          }

          if (changes.length === 0) {
            console.log('NO_CHANGES');
            process.exit(0);
          }

          fs.writeFileSync('/tmp/dep_changes.json', JSON.stringify(changes, null, 2));
          console.log('CHANGES_FOUND');
          changes.forEach(c => console.log(`  ${c.pkg}: ${c.from || '(new)'} -> ${c.to || '(removed)'} (${c.section}, ${c.kind})`));
          EOF

          if [ ! -f /tmp/dep_changes.json ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "changes_json<<EOF"
              cat /tmp/dep_changes.json
              echo
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no dependency changes
        if: steps.already-analyzed.outputs.skip != 'true' && steps.diff.outputs.has_changes != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**Dependency Upgrade Analysis**: no dependency changes detected in `package.json` for this PR.',
            });

      - name: Write prompt for OpenCode
        if: steps.already-analyzed.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        id: prompt
        run: |
          cat > /tmp/opencode_prompt.txt <<'EOF'
          A pull request changed the project's `package.json`. Your job is to
          produce a structured impact report for the changed dependencies and
          write it as a single Markdown file.

          PR context (injected by the workflow):
          - PR number: ${{ github.event.pull_request.number }}
          - PR title: ${{ github.event.pull_request.title }}
          - PR URL:   ${{ github.event.pull_request.html_url }}
          - Repository: ${{ github.repository }}

          Detected dependency changes (JSON array of {pkg, from, to, section, kind}):

          ```json
          ${{ steps.diff.outputs.changes_json }}
          ```

          Follow the `analyze-dependency-upgrade` skill exactly:

          1. For each entry in the JSON array, treat it as a single direct
             dependency upgrade. If `from` is null, it is a new package
             (no breaking-change/deprecation analysis, only new addition).
             If `to` is null, it was removed.
          2. Read `package.json`, `pnpm-lock.yaml`, `.nvmrc`, and any relevant
             config files (`.prettierrc`, `eslint.config.mjs`, `prisma/schema.prisma`,
             `tsconfig.json`) on the current branch.
          3. Use webfetch to fetch the upstream changelog / release notes for
             the package. Try GitHub releases, CHANGELOG.md, npm, and the
             vendor docs/blog in that order. Do not invent URLs.
          4. Extract breaking changes, deprecations, performance notes, new APIs,
             and migration notes for the range from -> to.
          5. Grep `src/`, `prisma/`, `test/`, `scripts/` for imports and symbol
             usage of the package, and cross-reference with the changelog.
             Record all matches with `file:line` references.
          6. Build the final Markdown report following the exact structure
             described in the `analyze-dependency-upgrade` skill (the
             PR-comment variant with the `Overall risk assessment` table
             and the per-package sections).

          Output:
          - Use the `write` tool to save the report to `/tmp/dep_report.md`
             so the workflow can post it as a PR comment.
          - ALSO print the report in your final response (for the run log).
          - Do NOT add a `<!-- dependency-upgrade-analysis -->` HTML marker
             yourself. The next workflow step prepends it deterministically
             before posting the comment. If you include it, the marker will
             be duplicated in the final comment.
          - Do NOT attempt to post the comment yourself. The next workflow
             step handles posting via the `gh` CLI.
          - Do NOT commit any file to the repository.

          Constraints:
          - Do not invent URLs or fabricate findings.
          - Match the project's voice: concise, direct, English, no emojis.
          EOF
          echo "prompt_file=/tmp/opencode_prompt.txt" >> "$GITHUB_OUTPUT"

      - name: Install opencode CLI
        if: steps.already-analyzed.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        id: install
        shell: bash
        run: |
          # Skip if already cached on the runner image
          if [ -x "$HOME/.opencode/bin/opencode" ]; then
            echo "opencode already installed at $HOME/.opencode/bin/opencode"
            echo "version=$( "$HOME/.opencode/bin/opencode" --version 2>/dev/null || echo cached )" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "version=$( "$HOME/.opencode/bin/opencode" --version 2>/dev/null || echo installed )" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode dependency analysis
        if: steps.already-analyzed.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        id: analysis
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ensure opencode is on PATH for this step (the GITHUB_PATH export
          # from a previous step is not visible in this fresh shell).
          export PATH="$HOME/.opencode/bin:$PATH"

          # Run opencode in non-interactive mode. We do NOT use
          # `opencode github run` because that subcommand asserts the
          # PR author has write permissions on the repo, which fails
          # for PRs opened by external bots (Renovate, Dependabot).
          # The agent writes the report to /tmp/dep_report.md via the
          # `write` tool (instructed in the prompt); we then post the
          # comment from the next step using `gh`.
          #
          # `opencode run` requires a positional MESSAGE argument; --file
          # only attaches extra context. We pass a short directive as the
          # message and attach the full prompt via --file.
          #
          # `--auto` auto-approves non-explicitly-denied tool calls so the
          # agent can use read/grep/webfetch/write without being blocked
          # by interactive permission prompts in a non-TTY environment.
          opencode run \
            --model opencode/big-pickle \
            --file /tmp/opencode_prompt.txt \
            --auto \
            "Read the attached prompt file and follow its instructions to produce a dependency upgrade analysis report. Write the report to /tmp/dep_report.md using the write tool." \
            > /tmp/opencode_stdout.log 2>&1 || {
              echo "::error::opencode run failed. Last 100 lines of output:"
              tail -n 100 /tmp/opencode_stdout.log
              exit 1
            }

          if [ ! -s /tmp/dep_report.md ]; then
            echo "::error::opencode did not write /tmp/dep_report.md"
            echo "Last 100 lines of opencode output:"
            tail -n 100 /tmp/opencode_stdout.log
            exit 1
          fi
          echo "Report size: $(wc -c < /tmp/dep_report.md) bytes"
          echo "First line of report: $(head -n 1 /tmp/dep_report.md)"

      - name: Post or update PR comment
        if: steps.already-analyzed.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          {
            echo "<!-- dependency-upgrade-analysis:${HEAD_SHA} -->"
            echo
            cat /tmp/dep_report.md
          } > /tmp/comment_body.md

          echo "Comment body size: $(wc -c < /tmp/comment_body.md) bytes"

          # Find existing comment from this workflow (by generic marker prefix
          # so we can update any prior analysis comment regardless of SHA).
          EXISTING=$(gh api \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | startswith("<!-- dependency-upgrade-analysis")) | .id' \
            | head -1 || true)

          if [ -n "${EXISTING:-}" ]; then
            # Build a JSON payload with the comment body. Use jq to avoid
            # quoting issues; --input tells gh api to read the body from
            # a file with the correct Content-Type.
            jq -Rs --arg b "$(cat /tmp/comment_body.md)" '{body: $b}' \
              /dev/null > /tmp/comment_payload.json
            gh api \
              "repos/${REPO}/issues/comments/${EXISTING}" \
              -X PATCH \
              --input /tmp/comment_payload.json
            echo "Updated existing comment #${EXISTING}"
          else
            gh pr comment "$PR_NUMBER" \
              --body-file /tmp/comment_body.md \
              --repo "$REPO"
            echo "Created new comment"
          fi

      - name: Auto-merge if all packages are low-risk Proceed
        if: steps.already-analyzed.outputs.skip != 'true' && steps.diff.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          RUN_ID="${GITHUB_RUN_ID:-}"

          # Keep a single decision comment per PR, keyed by a marker that
          # never collides with the analysis report comment (which starts with
          # the "dependency-upgrade-analysis" prefix and is managed by the
          # "Post or update PR comment" step). Updating in place avoids
          # spamming the same comment on every workflow run.
          post_or_update_decision() {
            local body_file="$1"
            local existing
            existing=$(gh api \
              "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.body | startswith("<!-- dependency-upgrade-decision -->")) | .id' \
              | head -1 || true)

            if [ -n "${existing}" ]; then
              jq -Rs --arg b "$(cat "$body_file")" '{body: $b}' \
                /dev/null > /tmp/am_payload.json
              gh api \
                "repos/${REPO}/issues/comments/${existing}" \
                -X PATCH \
                --input /tmp/am_payload.json > /dev/null
              echo "Updated decision comment #${existing}"
            else
              gh pr comment "$PR_NUMBER" \
                --body-file "$body_file" \
                --repo "$REPO" > /dev/null
              echo "Created decision comment"
            fi
          }

          RISK_TABLE=$(sed -n '/^## Overall risk assessment/,/^---$/p' /tmp/dep_report.md \
            | grep '^|' | tail -n +3)

          if [ -z "$RISK_TABLE" ]; then
            echo "Could not extract risk assessment table. Skipping auto-merge."
            exit 0
          fi

          ALL_PROCEED=true
          while IFS='|' read -r _ _ _ _ risk action _; do
            risk=$(echo "$risk" | xargs)
            action=$(echo "$action" | xargs)
            if [ "$risk" != "Low" ] || [ "$action" != "Proceed" ]; then
              ALL_PROCEED=false
              break
            fi
          done <<< "$RISK_TABLE"

          if [ "$ALL_PROCEED" != "true" ]; then
            echo "Manual review required — not all packages are Low / Proceed."
            exit 0
          fi

          echo "All packages are Low risk / Proceed. Checking CI status..."

          # Ignore this workflow's own check runs when evaluating CI status.
          # GitHub Actions check runs carry the workflow run id in their
          # `external_id`, and this workflow's check is still in_progress while
          # this step runs. Counting it made this step defer the merge (and
          # re-post the same comment) on every run.
          CHECKS=$(gh api \
            "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --jq "[.check_runs[] | select((.external_id | tostring) != \"${RUN_ID}\") | {name: .name, status: .status, conclusion: .conclusion}]")

          echo "Check runs for ${HEAD_SHA} (excluding current workflow run ${RUN_ID}):"
          echo "$CHECKS" | jq -r '.[] | "  \(.name): \(.status) (\(.conclusion // "pending"))"'

          ALL_CHECKS_PASSED=true
          while IFS= read -r line; do
            status=$(echo "$line" | jq -r '.status')
            conclusion=$(echo "$line" | jq -r '.conclusion // "pending"')
            name=$(echo "$line" | jq -r '.name')
            if [ "$status" != "completed" ]; then
              echo "Check '${name}' is still ${status}"
              ALL_CHECKS_PASSED=false
              break
            fi
            if [ "$conclusion" != "success" ] && [ "$conclusion" != "neutral" ] && [ "$conclusion" != "skipped" ]; then
              echo "Check '${name}' concluded: ${conclusion}"
              ALL_CHECKS_PASSED=false
              break
            fi
          done < <(echo "$CHECKS" | jq -c '.[]')

          if [ "$ALL_CHECKS_PASSED" != "true" ]; then
            echo "::warning::Not all CI checks passed. Deferring auto-merge."

            # Other CI checks are still running. Enable GitHub's native
            # auto-merge instead of only commenting, so GitHub merges once the
            # required checks pass — including this workflow's own check, which
            # completes when this run ends — without needing a re-run.
            if gh pr merge "$PR_NUMBER" \
              --squash \
              --delete-branch \
              --auto \
              --repo "$REPO"; then
              echo "Auto-merge enabled for PR #${PR_NUMBER}; GitHub will merge once CI passes."
              cat > /tmp/am_decision.md <<'EOF'
          <!-- dependency-upgrade-decision -->
          **Auto-analysis**: all dependency upgrades assessed as Low risk / Proceed. CI checks still running — auto-merge enabled, merging once they pass.
          EOF
              post_or_update_decision /tmp/am_decision.md || true
              exit 0
            fi

            echo "::warning::Native auto-merge unavailable (may be disabled in repository settings)."

            if gh pr merge "$PR_NUMBER" \
              --squash \
              --delete-branch \
              --repo "$REPO"; then
              echo "PR #${PR_NUMBER} merged and branch deleted."
              cat > /tmp/am_decision.md <<'EOF'
          <!-- dependency-upgrade-decision -->
          **Auto-analysis**: all dependency upgrades assessed as Low risk / Proceed. Merged.
          EOF
            else
              echo "::warning::Merge deferred until CI checks pass."
              cat > /tmp/am_decision.md <<'EOF'
          <!-- dependency-upgrade-decision -->
          **Auto-analysis passed** (all Low risk / Proceed) but CI checks are not all passing. Merge deferred until checks pass.
          EOF
            fi
            post_or_update_decision /tmp/am_decision.md || true
            exit 0
          fi

          echo "All CI checks passed. Attempting merge."

          # Prefer native auto-merge so GitHub waits for this workflow's own
          # check (still in_progress here) before merging; fall back to a
          # direct merge if auto-merge is disabled in repository settings.
          if gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --auto \
            --repo "$REPO" 2>/dev/null; then
            echo "PR #${PR_NUMBER} auto-merge requested."
            cat > /tmp/am_decision.md <<'EOF'
          <!-- dependency-upgrade-decision -->
          **Auto-analysis**: all dependency upgrades assessed as Low risk / Proceed. All CI checks passed. Merging.
          EOF
            post_or_update_decision /tmp/am_decision.md || true
          elif gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --repo "$REPO"; then
            echo "PR #${PR_NUMBER} merged and branch deleted."
          else
            echo "::warning::Auto-merge failed — branch protection may require manual approval."
            cat > /tmp/am_decision.md <<'EOF'
          <!-- dependency-upgrade-decision -->
          **Auto-analysis passed** but merge failed. Branch protection likely requires manual approval.
          EOF
            post_or_update_decision /tmp/am_decision.md || true
          fi
