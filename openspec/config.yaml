schema: spec-driven-bpmn

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  archive:
    guidance:
      - After spec sync has been verified and before moving the change directory, promote process diagrams. Walk each capability path in the change's specs/ tree.
      - If a capability has both process.bpmn and process.retired, or a process.svg without process.bpmn, stop and do not archive.
      - If it has process.bpmn, it must also have process.svg. Copy both onto openspec/specs/<capability>/, replacing any existing files.
      - If it has only process.retired, delete openspec/specs/<capability>/process.bpmn and process.svg when those files exist.
      - If it has neither process.bpmn nor process.retired, leave the living process.bpmn and process.svg unchanged.
      - If the archive proceeds without spec sync, do not copy or delete living process.bpmn or process.svg files. They stay inside the archived change.
